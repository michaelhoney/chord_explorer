name: Check

# The same gates the deploy runs, on every pull request — so a PR shows
# whether it would deploy before it's merged, rather than finding out on main.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read

# a new push to the PR supersedes the run still going for the old one
concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # the suites cover the pure modules; the build is what catches a broken
      # import in a component
      - run: npm run build
